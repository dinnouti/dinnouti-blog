baseURL = "https://alex.dinnouti.com/"
languageCode = 'en-us'
title = 'Alex_Tech_Blog'
theme = "dinnouti"
pygmentsUseClasses=true
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "llms"]

[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["txt"]

[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[params]
  [params.author]
    name = "Alex Dinnouti"

[sitemap]
  changefreq = 'monthly'
  filename = 'sitemap.xml'
  priority = 0.5

[markup]
  [markup.highlight]
    noClasses=false
    tabWidth = 4
