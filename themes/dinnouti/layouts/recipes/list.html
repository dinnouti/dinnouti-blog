{{ define "main" }}
<main>
  <div class="list-header">
    <span class="list-prompt">$ ls -la ./recipes</span>
    <h1>{{ .Title }}</h1>
  </div>

  {{ if .Content }}
  <div class="recipe-intro post-body">{{ .Content }}</div>
  {{ end }}

  <div class="post-feed">
    {{ range .Paginator.Pages }}
      {{ .Render "summary" }}
    {{ end }}
  </div>

  {{ template "_internal/pagination.html" . }}
</main>
{{ end }}
