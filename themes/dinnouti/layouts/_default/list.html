{{ define "main" }}
<main>
  <div class="list-header">
    <span class="list-prompt">$ grep -rl "{{ .Title }}" ./posts</span>
    <h1>{{ .Title }}</h1>
  </div>

  <div class="post-feed">
    {{ range .Paginator.Pages }}
      {{ .Render "summary" }}
    {{ end }}
  </div>

  {{ template "_internal/pagination.html" . }}
</main>
{{ end }}
