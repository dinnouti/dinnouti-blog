{{ define "main" }}
<div class="feed-intro">
  <span class="feed-intro-line"># {{ len (where .Site.RegularPages "Type" "in" .Site.Params.mainSections) }} posts found</span>
</div>
<div class="post-feed">
  {{ range (where .Site.RegularPages "Type" "in" .Site.Params.mainSections) }}
    {{ .Render "summary" }}
  {{ end }}
</div>
{{ end }}
